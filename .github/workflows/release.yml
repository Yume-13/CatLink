# Builds CatLink on a version tag (vMAJOR.MINOR.PATCH) and publishes
# CatLink-<version>-windows.zip as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (MAJOR.MINOR.PATCH); no release is created'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          1..20 | ForEach-Object { 'y' } | & $sdkmanager --licenses | Out-Null
          & $sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' | Out-Null

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: windows

      - name: Install cargo-about
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-about

      - name: Release key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.CATLINK_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) {
            if ('${{ github.event_name }}' -eq 'push') { throw 'Secret CATLINK_KEYSTORE_BASE64 is required for releases.' }
            Write-Host 'No release key; the APK is signed with the debug key.'
            exit 0
          }
          $path = Join-Path $env:RUNNER_TEMP 'catlink-release.jks'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "CATLINK_KEYSTORE=$path" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        env:
          CATLINK_KEYSTORE_PASSWORD: ${{ secrets.CATLINK_KEYSTORE_PASSWORD }}
          CATLINK_KEY_ALIAS: ${{ secrets.CATLINK_KEY_ALIAS }}
          CATLINK_KEY_PASSWORD: ${{ secrets.CATLINK_KEY_PASSWORD }}
        run: ./build.ps1 -Version $env:VERSION.TrimStart('v')

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CatLink-windows
          path: CatLink-*-windows.zip

      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          gh release create $env:VERSION "CatLink-$version-windows.zip" --title "CatLink $version" --notes "Extract the zip and run catlink.exe, which installs catlink.apk on the phone if it isn't there yet."
